<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const Weather = fetch("https://api.weatherapi.com/v1/current.json?key=164965e61e924f2b95f62147260901&q=London&aqi=no").then((res) => {
            return res.json()
        }).then((data) => {
            console.log(data)
            Disply(data)
        }).catch((err) => {
            console.log(err)
        })


        function Disply(el) {
            const div = document.createElement("div")
            const h1 = document.createElement("h1")
            const h2 = document.createElement("h1")
            const h3 = document.createElement("h1")
            const h4 = document.createElement("h1")
            const imag = document.createElement("img")
            const h6 = document.createElement("h1")

            h1.innerText = el.location.name
            h2.innerText = el.location.region
            h3.innerText = el.location.country
            h4.innerText = el.current.condition.text
            imag.src = el.current.condition.icon
            h6.innerText = el.current.condition.code


            div.append(h1, h2, h3, h4, imag, h6)
            document.querySelector("body").append(div)
        }
    </script>
</body>

</html>
