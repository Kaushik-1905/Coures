   <body>

<form>
    <input type="text" id="email" placeholder="Email" required><br><br>
    <input type="text" id="password" placeholder="Password" required><br><br>

    <input type="submit" value="Login">
</form>

<script>

document.querySelector("form").addEventListener("submit", loginFun)

function loginFun(e) {
    e.preventDefault()

    let email = document.getElementById("email").value
    let password = document.getElementById("password").value

    //localStorage mathi data leva
    let data = JSON.parse(localStorage.getItem("info"))

    //storage ma data no hoy to
    if (!data || data.length == 0) {
        alert("No user registered. Please register first");
        return;
    }

    // check user
    let userFound = data.some(user => user.email == email)

    if (userFound) {
        alert("Login Successful");
    } else {
        alert("User not registered");
    }
}

</script>
</body>
