<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
</head>

<style>
    #product {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    #product div {
        width: 200px;
        padding: 10px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 8px;

        display: flex;
        flex-direction: column;
    }

    img {
        width: 200px;
        height: auto;
        margin: auto ;
    }

    #product button {
        margin-top: auto;
        padding: 8px 12px;
        white-space: nowrap;
    }

    #product h2{
        margin-top: auto;
    }

    #product p{
        margin-top: auto;
    }
</style>

<body>

    <input type="text" id="search" placeholder="Search By Name..." onkeyup="applyFilters()">
    <select id="sortPrice" onchange="applyFilters()">
        <option value="">Sort by Price</option>
        <option value="low">Low to High</option>
        <option value="high">High to Low</option>
    </select>

    <select id="sortName" onchange="applyFilters()">
        <option value="">Sort by Name</option>
        <option value="asc">A ->Z</option>
        <option value="desc">Z -> A</option>
    </select>


    <div id="product"></div>




    <script>

        const productData = [{
            id: 101,
            image: "https://i.dell.com/is/image/DellContent/content/dam/images/products/electronics-and-accessories/dell/pointing-devices/ms300/ms300-kbm-04-bk.psd?fmt=pjpg&pscan=auto&scl=1&wid=4141&hei=3475&qlt=100,1&resMode=sharp2&size=4141,3475&chrss=full&imwidth=5000",
            name: "Wireless Mouse",
            price: 29.99,

        },
        {
            id: 102,
            image: "https://i.rtings.com/assets/pages/xXDZ1p9x/best-rgb-keyboards-20240515-2-medium.jpg?format=auto",
            name: "Bluetooth Keyboard",
            price: 49.99,
        },
        {
            id: 103,
            image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn-FBRBZcwzJT5TFrN3ELDZ4LmPVnl6AFCLQ&s",
            name: "HD Monitor",
            price: 199.99,
        },
        {
            id: 104,
            image: "https://images.philips.com/is/image/philipsconsumer/a10ea7f6c75a4cf4b7caafaf00cba3dd?wid=700&hei=700&$pnglarge$",
            name: "Smart TV",
            price: 500.01,
        },
        {
            id: 104,
            image: "https://4.imimg.com/data4/SJ/BA/MY-3018414/apple-laptop-500x500.jpg",
            name: "Laptop",
            price: 436.11,
        }];





        // var cart = {};   // key-value cart object

        function display(productData) {
            let container = document.getElementById("product");
            container.innerHTML = "";
            productData.forEach((val) => {
                const div = document.createElement("div");

                const img = document.createElement("img");
                img.src = val.image;

                const name = document.createElement("h2");
                name.innerText = val.name;

                const price = document.createElement("p");
                price.innerText = `₹${val.price}`;

                const btn = document.createElement("button");
                btn.innerText = "Add to Cart";

                // // call addToCart when button clicked
                btn.onclick = () => addToCart(val);


                div.append(img, name, price, btn);
                container.append(div)
            });
        }


        product = []
        function addToCart(item) {

            product.push(item);

            // save to localStorage
            localStorage.setItem("cart", JSON.stringify(product));

            // console.log("Cart:", cart);
        }


        function applyFilters() {
            let searchText = document.getElementById("search").value.toLowerCase();
            let sortPrice = document.getElementById("sortPrice").value;
            let nameSort = document.getElementById("sortName").value;
            let filtered = productData.filter(p => p.name.toLowerCase().includes(searchText));

            // Sort by Price
            if (sortPrice === "low") {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortPrice === "high") {
                filtered.sort((a, b) => b.price - a.price);
            }

            // sort By name
            if (nameSort === "asc") {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (nameSort === "desc") {
                filtered.sort((a, b) => b.name.localeCompare(a.name));
            }

            display(filtered);
        }


        display(productData);
    </script>

</body>

</html>
