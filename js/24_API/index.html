<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
     <script>
        var data = fetch("https://api.rootnet.in/covid19-in/stats/latest").then((res) => {
            return res.json()
        }).then((data) => {
            console.log(data)
            corona(data)
        }).catch((err) => {
            console.log(err)
        })


        function corona(val) {
            
            const indexes = Math.floor(Math.random()*val.data.regional.length)
            const div = document.createElement("div")
            const loc = document.createElement("h3")
            const confirmcaseI = document.createElement("h4")
            const confirmcaseF = document.createElement("h4")
            const discharged = document.createElement("h5")


            loc.innerHTML = "Location: "+val.data.regional[indexes].loc
            confirmcaseI.innerHTML = "ConfirmcasesIndian: "+val.data.regional[indexes].confirmedCasesIndian
            confirmcaseF.innerHTML = "ConfirmcasesForeign: "+val.data.regional[indexes].confirmedCasesForeign
            discharged.innerHTML = "discharged: "+val.data.regional[indexes].discharged



            div.append(loc, confirmcaseI,confirmcaseF,discharged)
            document.querySelector("body").append(div)
        }
    </script>
</body>
</html>
